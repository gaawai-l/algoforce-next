services:
  web:
    build:
      context: .
      dockerfile: deploy/test/Dockerfile
      target: web
      args:
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    expose:
      - "80"
    depends_on:
      - analytics
      - wealthfolio
      - wallet-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  wallet-auth:
    build:
      context: .
      dockerfile: deploy/test/Dockerfile
      target: wallet-auth
    environment:
      WALLET_AUTH_ORIGIN: ${WALLET_AUTH_ORIGIN:-https://gfbk0bsvzvpdv2tonftg9cp6.45.32.124.189.sslip.io}
      WALLET_AUTH_ADDRESSES: ${WALLET_AUTH_ADDRESSES:-0x11890834531ad1127863895fa83983bfc6347bb0,0x092b5f11c081b7f607e7dbf0167d5f9267da215e}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
    volumes:
      - wallet-auth-test:/data
    expose:
      - "8790"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  analytics:
    build:
      context: .
      dockerfile: deploy/test/Dockerfile
      target: analytics
    environment:
      WHEELHOUSE_DATA_DIR: /data
      WHEELHOUSE_DEPLOYMENT: test
    volumes:
      - analytics-test:/data
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/wheelhouse/v1/status', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  wealthfolio:
    image: wealthfolio/wealthfolio:3.8.0@sha256:3c6f117828949204029c2b4a391f039e62987b4e091139e11b04e6764b5f6866
    environment:
      WF_SECRET_KEY: ${WF_SECRET_KEY:?Set independent test encryption key}
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DB_PATH: /data/wealthfolio.db
      WF_AUTH_REQUIRED: "false"
      WF_MCP_ENABLED: "false"
    volumes:
      - wealthfolio-test:/data
    expose:
      - "8088"
    restart: unless-stopped
volumes:
  wallet-auth-test:
  analytics-test:
  wealthfolio-test:

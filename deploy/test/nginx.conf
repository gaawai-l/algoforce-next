map "$http_origin|$http_host" $cross_origin {
    default 1;
    ~^\| 0;
    ~^https?://([^/|]+)\|\1$ 0;
}
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $analytics_backend http://analytics:8787;
    set $wealthfolio_backend http://wealthfolio:8088;
    set $wallet_backend http://wallet-auth:8790;
    root /usr/share/nginx/html;
    if ($cross_origin) { return 403; }
    auth_basic off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
    location = /_wallet_session {
        internal;
        proxy_pass $wallet_backend/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location /auth/ {
        client_max_body_size 16k;
        proxy_pass $wallet_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 15s;
    }
    location = /login { return 302 /login/; }
    location /login/ {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /login/index.html;
    }
    location = /api/wheelhouse/v1/portfolio/discover { return 403; }
    location = /api/wheelhouse/v1/portfolio/sync { return 403; }
    location /api/wheelhouse/ {
        auth_request /_wallet_session;
        proxy_pass $analytics_backend;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header Origin "http://127.0.0.1:1420";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location /api/ {
        auth_request /_wallet_session;
        proxy_pass $wealthfolio_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        auth_request /_wallet_session;
        error_page 401 = @wallet_login;
        try_files $uri $uri/ /index.html;
    }
    location @wallet_login { return 302 /login/?next=$uri; }
}

map "$http_origin|$http_host" $cross_origin {
    default 1;
    ~^\| 0;
    ~^https?://([^/|]+)\|\1$ 0;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    if ($cross_origin) { return 403; }
    auth_basic "Wheelhouse test";
    auth_basic_user_file /etc/nginx/test.htpasswd;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }
    location = /api/wheelhouse/v1/portfolio/discover { return 403; }
    location = /api/wheelhouse/v1/portfolio/sync { return 403; }
    location /api/wheelhouse/ {
        proxy_pass http://analytics:8787;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header Origin "http://127.0.0.1:1420";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location /api/ {
        proxy_pass http://wealthfolio:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

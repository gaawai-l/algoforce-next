function holdingsTable(risk=false){let list=positions.filter(p=>state.filter==='all'||p.stage===state.filter);return `<div class="table-wrap"><table><thead><tr><th>Asset / Position</th><th>${risk?'Spot':'Strategy'}</th><th>Expiry / DTE</th><th>Net Δ · shares</th><th>${risk?'Γ · /$':'Open P&L'}</th><th>Θ · $/day</th><th>${risk?'Vega · $/1pp':'Details'}</th></tr></thead><tbody>${list.map(p=>`<tr><td>${symbol(p)}<small>${p.shares?p.shares+' shares + ':''}${p.qty} × ${p.strike}${p.type==='Call'?'C':'P'}</small></td><td>${risk?money(p.price):`<span class="pill">${p.stage==='put'?'Cash-secured Put':'Covered Call'}</span>`}</td><td>${p.expiry}<br><small ${p.dte<7?'style="color:var(--gold)"':''}>${p.dte} days</small></td><td class="num">+${p.netDelta}</td><td class="num">${risk?(p.qty*100*p.gamma).toFixed(2):signed(p.symbol==='AAPL'?980:p.symbol==='NVDA'?0:840)}</td><td class="num positive">+${p.netTheta.toFixed(2)}</td><td>${risk?(p.qty*100*p.vega).toFixed(0):`<button class="link" data-detail="${p.symbol}">Inspect ↗</button>`}</td></tr>`).join('')}</tbody></table></div>`}
function filter(){return `<label class="filterlabel">Strategy<select id="strategy-filter"><option value="all" ${state.filter==='all'?'selected':''}>All strategies</option><option value="put" ${state.filter==='put'?'selected':''}>Short Put</option><option value="covered" ${state.filter==='covered'?'selected':''}>Covered Call</option></select></label>`}
function VariantA(){return `<main class="a-main"><div class="topline row between"><span>Portfolio <span style="padding:0 9px">/</span> Personal account</span><span class="row"><span class="pill amber">DEMO DATA</span><span class="desktop-only">AS OF 09.26 / 04:00 SGT</span></span></div><div class="page-heading row between"><div><div class="eyebrow hero-label">PERSONAL STRATEGY TERMINAL / 01</div><h1>Own the <span class="glow-word">cycle.</span></h1><p>Your capital. Your positions. Every risk in focus.</p></div><button class="button" data-info="source">Data link ↗</button></div><section class="grid stats" id="overview">${metric('Net liquidation value',money(128190),'Total return +$8,190 / +6.83%','net-card')}${metric('Realized P&L / MTD',signed(730),'Closed trades / net of demo fees')}${metric('Deployable cash',money(37500),'$62,500 cash − $25,000 reserved')}${metric('Net dollar Delta',money(54990),'42.9% of NAV / not beta-weighted')}</section><section class="grid two section"><div class="card"><div class="card-title"><div><h2>Portfolio equity</h2><small>Sample period / no external cash flows</small></div>${periods()}</div>${lineChart()}<div class="legend"><span><i></i>Portfolio equity · USD</span><span>Illustrative curve, not a return calculation</span></div></div><div class="card"><div class="card-title"><h2>Capital allocation</h2><span class="eyebrow">CAPITAL</span></div><div class="num" style="font-size:30px">$37,500 <small style="font-size:12px">available</small></div><div class="funding"><span></span><span></span><span></span></div><div class="summary-line"><span>Net securities value</span><strong class="num">$65,690</strong></div><div class="summary-line"><span>Put cash reserve</span><strong class="num">$25,000</strong></div><div class="summary-line"><span>Unallocated cash</span><strong class="num">$37,500</strong></div><div class="divider"></div><p class="brief">Assignment on 2 NVDA puts requires <strong>$25,000</strong>. Cash is reserved at full strike value, independent of broker margin requirements.</p></div></section><section id="cycles" class="card section nav-section"><div class="card-title"><div><h2>Active wheels <small style="margin-left:8px">3 underlyings</small></h2><small>Stocks and options, grouped by underlying</small></div>${filter()}</div>${holdingsTable()}</section><section id="risk" class="grid two section nav-section"><div class="notice"><span aria-hidden="true" style="font-size:20px">◷</span><div><strong>ON YOUR RADAR / NVDA 125 PUT</strong>6 days to expiry. Spot is 5.6% above strike. Net Delta: +48 shares. Inspect the position for its cycle history.</div></div><div class="card" style="padding:14px 20px"><div class="row between"><span><small>Portfolio Theta</small><br><strong class="num">+$23.50 / day</strong></span><span><small>Portfolio Vega</small><br><strong class="num">−$58 / 1pp</strong></span><button class="button" data-variant="C">Risk monitor ↗</button></div><div class="caption">Theta is model sensitivity, not guaranteed daily income.</div></div></section>${stateFooter()}</main>`}
function cycleCard(p){return `<article class="cycle-card"><div class="row between"><div><h3>${p.symbol}</h3><small>CYCLE ${p.symbol==='MSFT'?'04':p.symbol==='AAPL'?'02':'01'} / ${p.name}</small></div><span class="pill ${p.dte<7?'amber':''}">${p.dte} DTE</span></div><div class="contract">${p.shares?p.shares+' shares + ':''}Short ${Math.abs(p.qty)} × ${p.strike} ${p.type}<br><small>Expires ${p.expiry}/2026 / Spot ${money(p.price)}</small></div><div class="cycle-metrics"><div><small>Cycle premiums received</small><strong class="num">${money(p.premium)}</strong></div><div><small>Cycle realized P&L</small><strong class="num positive">${signed(p.realized)}</strong></div></div><div class="divider" style="margin:17px 0 12px"></div><div class="row between"><small>Net Delta <strong>+${p.netDelta}</strong></small><small>Daily Theta <strong>+${p.netTheta.toFixed(2)}</strong></small></div><button class="cycle-action" data-detail="${p.symbol}">Inspect cycle timeline <span style="float:right">↗</span></button></article>`}
function VariantB(){return `<main class="b-main"><section class="b-intro"><div><div class="eyebrow">THE WHEEL JOURNAL / SEP 2026</div><h1>Follow the wheel.<br><span class="glow-word">Read the signal.</span></h1><p>Short puts. Take assignment. Write calls. One continuous timeline.</p></div><div class="b-overview"><div><small>Cycle premiums received</small><div class="value num">$1,860</div><small>Not the same as realized profit</small></div><div><small>Realized strategy P&L</small><div class="value num positive">+$730</div><small>3 active cycles</small></div></div></section><div class="board-toolbar row between"><h2>Cycle command <small style="margin-left:9px">3 ACTIVE</small></h2><div class="row"><span class="pill amber">DEMO POSITIONS</span><button class="button" data-info="cycles">Grouping logic ⓘ</button></div></div><section class="cycle-board"><div class="lane"><div class="lane-head"><strong>01 <span class="muted" style="margin-left:7px">Short puts / Awaiting assignment</span></strong><span class="count">1</span></div>${cycleCard(positions[1])}<p class="caption">$25,000 reserved / strike × contracts × 100</p></div><div class="lane"><div class="lane-head"><strong>02 <span class="muted" style="margin-left:7px">Holding shares / Calls unwritten</span></strong><span class="count">0</span></div><div class="empty-cycle"><div class="ring" aria-hidden="true">◌</div><h3>No positions at this stage</h3><p style="margin-top:10px">Assigned shares appear here.<br>Their history stays with the same cycle.</p></div><p class="caption">Stage tracking only. No trade execution.</p></div><div class="lane"><div class="lane-head"><strong>03 <span class="muted" style="margin-left:7px">Covered calls / Awaiting expiry</span></strong><span class="count">2</span></div>${cycleCard(positions[0])}${cycleCard(positions[2])}</div></section><section class="b-bottom"><div><div class="card-title"><h2>Cycle activity</h2><small>DEMO TRANSACTIONS</small></div><div class="b-log"><span class="date">09/24</span><div><strong>AAPL / Sell to open call</strong><br><small>235 Call / Oct 16 expiry / 1 contract</small></div><span class="positive num">+$500 premium</span></div><div class="b-log"><span class="date">09/21</span><div><strong>NVDA / Cycle 01 opened</strong><br><small>125 Put / Oct 02 expiry / 2 contracts</small></div><span class="positive num">+$480 premium</span></div><div class="b-log"><span class="date">09/18</span><div><strong>AAPL / Put assignment</strong><br><small>100 shares × $220 / cycle stock basis</small></div><span class="num">−$22,000 cash</span></div></div><div class="card"><div class="eyebrow">RISK TELEMETRY</div><h2 style="margin:10px 0 20px">Premium has a risk profile.</h2><div class="row between"><div><small>Net dollar Delta</small><div class="num" style="font-size:24px">$54,990</div></div><div><small>Theta / day</small><div class="num" style="font-size:24px">+$23.50</div></div></div><p class="caption">Theta is estimated sensitivity. Market moves can outweigh time decay.</p><button class="button" data-variant="C" style="margin-top:20px;width:100%">Open risk monitor →</button></div></section>${stateFooter()}</main>`}
function sensitivityChart(){return `<svg class="chart" viewBox="0 0 600 185" role="img" aria-label="Dollar Delta by underlying: MSFT 33150, AAPL 15504, NVDA 6336 USD">${positions.map((p,i)=>`<text x="0" y="${40+i*53}">${p.symbol}</text><rect x="70" y="${25+i*53}" width="430" height="22" rx="3" fill="var(--border)"/><rect x="70" y="${25+i*53}" width="${p.dollar/35000*430}" height="22" rx="3" fill="${i===2?'#a995ff':i===1?'#77baff':'#5df8d5'}"/><text x="520" y="${40+i*53}">${money(p.dollar)}</text>`).join('')}</svg>`}
function shockPnl(){let s=state.shock/100;return positions.reduce((v,p)=>v+p.dollar*s+.5*p.qty*100*p.gamma*(p.price*s)**2+p.qty*100*p.vega*state.iv,0)}
function VariantC(){return `<main class="c-main"><div class="row between wrap"><div><div class="eyebrow">RISK MONITOR</div><h1 style="margin-top:7px">Expose the <span class="glow-word">risk.</span></h1></div><div style="text-align:right"><small>moomoo SG · USD · 09/26 04:00 SGT</small><br><small>Sample Greeks / Not live market data</small></div></div><section class="c-top"><div><small>Net liquidation value</small><div class="value num">$128,190</div><small>3 underlyings / 4 short contracts</small></div><div><small>Net dollar Delta</small><div class="value num">+$54,990</div><small>All spots +1%: first-order P&L +$549.90</small></div><div><small>Portfolio Theta</small><div class="value num positive">+$23.50 <small>/ day</small></div><small>Time-decay sensitivity, not promised income</small></div><div><small>Portfolio Vega</small><div class="value num negative">−$58 <small>/ 1pp</small></div><small>All option IVs +1 percentage point</small></div></section><div class="c-grid"><div><section class="card"><div class="card-title"><h2>Exposure matrix</h2><span class="pill">STOCK DELTA INCLUDED</span></div>${holdingsTable(true)}<div class="caption">Position-weighted Greeks / 100× contract multiplier. Delta and Gamma remain per underlying.</div></section><section class="card section"><div class="card-title"><h2>Directional exposure</h2><small>Dollar Delta / not beta-weighted</small></div>${sensitivityChart()}<div class="c-legend"><strong>MSFT carries 60.3% of directional exposure.</strong> Covered calls reduce Delta, but retain stock downside risk.</div></section></div><aside class="card"><div class="card-title"><h2>Shock the portfolio.</h2><button class="button" data-reset>Reset</button></div><small>LOCAL ESTIMATE / Δ + Γ + VEGA</small><div id="scenario-pnl" class="scenario-value num">${signed(shockPnl(),0)}</div><div id="scenario-percent" class="muted" style="font-size:12px">of NAV: ${(shockPnl()/128190*100).toFixed(2)}%</div><div class="divider"></div><div class="scenario"><label for="shock" class="row between"><span>Underlying price shock</span><strong id="shock-label">${state.shock>0?'+':''}${state.shock}%</strong></label><input id="shock" type="range" min="-5" max="5" step=".5" value="${state.shock}"><div class="scenario-ends"><span>−5%</span><span>0%</span><span>+5%</span></div></div><div class="scenario"><label for="iv" class="row between"><span>Implied volatility shock</span><strong id="iv-label">${state.iv>0?'+':''}${state.iv}pp</strong></label><input id="iv" type="range" min="-5" max="5" step="1" value="${state.iv}"><div class="scenario-ends"><span>−5pp</span><span>0pp</span><span>+5pp</span></div></div><div class="divider"></div><p class="c-legend">Uniform spot moves, fixed Greeks, no time decay. A local approximation; excludes volatility skew, early exercise, liquidity and margin effects.</p></aside></div><section class="c-foot-grid"><div class="card"><div class="card-title"><h2>Expiry concentration</h2><small>SHORT CONTRACTS</small></div><div class="risk-list"><div><div class="row between"><span>0–7 days <small>NVDA</small></span><strong>2 contracts</strong></div><div class="bar"><i style="width:50%;background:var(--gold)"></i></div></div><div><div class="row between"><span>8–30 days <small>AAPL · MSFT</small></span><strong>2 contracts</strong></div><div class="bar"><i style="width:50%"></i></div></div></div><p class="caption">Near-expiry exposures can change rapidly. Scenario analysis only.</p></div><div class="card"><h2>Reading the signals</h2><div class="c-legend" style="margin-top:15px"><strong>Dollar Delta</strong> = Σ (net underlying Delta × spot price).<br><strong>Gamma</strong> = change in Delta per $1 underlying move.<br><strong>Vega</strong> is per 1 percentage-point IV move; Theta is per day.<br>Source: fictional dataset. Contract multiplier: 100.</div></div></section>${stateFooter()}</main>`}
function PrototypeSwitcher(){return `<div class="switcher" aria-label="Design variant switcher"><div class="tag">DESIGN PROTOTYPE<br>← → SWITCH LAYOUT</div><button class="arrow" data-step="-1" aria-label="Previous layout">←</button>${[['A','Overview'],['B','Cycles'],['C','Risk lab']].map(([k,n])=>`<button data-variant="${k}" aria-pressed="${state.variant===k}" class="${state.variant===k?'selected':''}">${k} · ${n}</button>`).join('')}<button class="arrow" data-step="1" aria-label="Next layout">→</button></div>`}
function render(){document.body.className='variant-'+state.variant;document.getElementById('app').innerHTML=appShell(({A:VariantA,B:VariantB,C:VariantC})[state.variant](),{A:'overview',B:'cycles',C:'risk'}[state.variant]);document.getElementById('switcher').innerHTML=PrototypeSwitcher();console.info('PROTOTYPE_STATE',JSON.stringify({...state,positions}));}
function choose(v){state.variant=v;state.filter='all';state.nav='overview';let u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render();window.scrollTo(0,0)}
function cycle(d){choose(['A','B','C'][(['A','B','C'].indexOf(state.variant)+d+3)%3])}
function detail(s){const p=positions.find(p=>p.symbol===s);state.selected=s;const d=document.getElementById('detail');d.innerHTML=`<div class="row between"><div><div class="eyebrow">WHEEL CYCLE / DEMO RECORD</div><h1 style="margin-top:6px">${s} / Cycle history</h1></div><button class="close" data-close aria-label="Close details">×</button></div><p class="muted" style="margin-top:12px">${p.stage==='put'?'Short puts / awaiting expiry or assignment':'Shares + short calls / awaiting expiry or assignment'}</p><div class="timeline">${s==='AAPL'?`<div class="event"><strong>09/04 / Short put closed</strong><small>Realized option P&L +$180 / net of fees</small></div><div class="event"><strong>09/18 / A subsequent put assigned</strong><small>100 shares assigned at $220 / $22,000 cash outflow<br>Simplified demo: net premium on this put is $0</small></div><div class="event"><strong>09/24 / Sell to open 235 call</strong><small>1 contract / $500 premium / current option liability $320<br>Open stock P&L $800 + open option P&L $180</small></div>`:`<div class="event"><strong>Closed trades in this cycle</strong><small>Realized P&L ${signed(p.realized)}. Excludes open stock and option positions.</small></div><div class="event"><strong>Current position</strong><small>${p.shares?p.shares+' shares + ':''}${Math.abs(p.qty)} short contracts × ${p.strike} ${p.type}, expiring ${p.expiry}.</small></div><div class="event"><strong>Next stage</strong><small>Awaiting actual closing, expiry or assignment records. No automated execution.</small></div>`}</div><div class="drawer-summary"><div class="card"><small>Premiums received</small><h2 class="num" style="margin-top:6px">${money(p.premium)}</h2></div><div class="card"><small>Realized strategy P&L</small><h2 class="num positive" style="margin-top:6px">${signed(p.realized)}</h2></div></div><p class="caption">Design prototype. Production P&L must reconcile executions, fees and assignments without double-counting premiums.</p>`;d.showModal();updateState()}
function info(kind){const d=document.getElementById('detail');d.innerHTML=`<div class="row between"><h2>${kind==='source'?'Data connection design':'Cycle grouping design'}</h2><button class="close" data-close aria-label="Close explanation">×</button></div><p style="margin:22px 0;line-height:1.9">${kind==='source'?'Planned source: local moomoo OpenD for Singapore account positions, fills and option Greeks. This prototype is offline and uses fictional data. The connected version will show timestamps, missing data and stale quotes.':'Group shares, puts and calls by account and underlying, then confirm cycle assignments. Rolls stay in the cycle timeline. Premiums received, realized P&L and open P&L remain separate. Stages here are illustrative.'}</p><span class="pill">READ-ONLY ANALYTICS / NO EXECUTION</span>`;d.showModal()}
function updateState(){const p=document.getElementById('state-view');if(p)p.textContent=JSON.stringify({...state,dataSource:'fictional',positions},null,2)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant)choose(b.dataset.variant);else if(b.dataset.step)cycle(Number(b.dataset.step));else if(b.dataset.period){state.period=b.dataset.period;render()}else if(b.dataset.detail)detail(b.dataset.detail);else if(b.hasAttribute('data-close')){document.getElementById('detail').close();state.selected=null;updateState()}else if(b.dataset.info)info(b.dataset.info);else if(b.hasAttribute('data-reset')){state.shock=0;state.iv=0;render()}else if(b.dataset.nav){state.nav=b.dataset.nav;document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el===b));document.getElementById(state.nav).scrollIntoView({behavior:'instant',block:'start'});updateState()}});
document.addEventListener('change',e=>{if(e.target.id==='strategy-filter'){state.filter=e.target.value;const y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('input',e=>{if(['shock','iv'].includes(e.target.id)){state[e.target.id]=Number(e.target.value);document.getElementById(e.target.id+'-label').textContent=(state[e.target.id]>0?'+':'')+state[e.target.id]+(e.target.id==='iv'?'pp':'%');let n=shockPnl(),out=document.getElementById('scenario-pnl');out.textContent=signed(n);out.className='scenario-value num '+(n<0?'negative':'positive');document.getElementById('scenario-percent').textContent='of NAV: '+(n/128190*100).toFixed(2)+'%';updateState()}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.getElementById('detail').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});document.getElementById('detail').addEventListener('close',()=>{state.selected=null;updateState()});window.addEventListener('popstate',()=>{state.variant=new URLSearchParams(location.search).get('variant')||'A';render()});render();
</script></body></html>

<!doctype html>
<!-- THROWAWAY UI PROTOTYPE. Question: chart-first, side-by-side evidence, or briefing-first market assessment? All market data and TD states are fictional. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheelhouse / Market Intelligence</title><link rel="icon" href="data:,"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="market-prototype.css"><link rel="stylesheet" href="app-shell.css"></head><body><div id="app"></div><div id="switcher"></div><dialog id="help"></dialog>
<script src="app-shell.js"></script><script>
const q=new URLSearchParams(location.search);
const state={variant:['A','B','C'].includes(q.get('variant'))?q.get('variant'):'A',symbol:['BTC/USDT','SPY','NVDA'].includes(q.get('symbol'))?q.get('symbol'):'BTC/USDT',timeframe:['1h','4h','1d'].includes(q.get('timeframe'))?q.get('timeframe'):'4h',tab:['td9','levels','fib'].includes(q.get('tab'))?q.get('tab'):'td9',tdView:'sequential',zoom:72,selectedLevel:null,anchorMode:null,anchorA:null,anchorB:null,formError:'',selectedBar:null};
const profiles={'BTC/USDT':{name:'Bitcoin / Tether',market:'Crypto',price:83920,low:78000,high:87500,levels:[{p:88210,side:'resistance',name:'R3',strength:'Moderate',methods:['Swing high','Donchian'],tfs:['4h','1d']},{p:86530,side:'resistance',name:'R2',strength:'Moderate',methods:['Volume profile','Pivot'],tfs:['1h','4h']},{p:85200,side:'resistance',name:'R1',strength:'Strong',methods:['Swing high','Round number','AVWAP'],tfs:['1h','4h','1d']},{p:82800,side:'support',name:'S1',strength:'Strong',methods:['Volume profile','Pivot','Fib 0.500'],tfs:['1h','4h','1d']},{p:81150,side:'support',name:'S2',strength:'Moderate',methods:['Fib 0.618','Keltner'],tfs:['4h','1d']},{p:79950,side:'support',name:'S3',strength:'Moderate',methods:['Weekly low','SMA 200'],tfs:['4h','1d']}]},'SPY':{name:'SPDR S&P 500 ETF',market:'US stocks',price:612.4,low:580,high:630},'NVDA':{name:'NVIDIA Corporation',market:'US stocks',price:132,low:118,high:143}};
function profile(){const p={...profiles[state.symbol]};if(!p.levels)p.levels=[1.052,1.031,1.015,.987,.967,.952].map((f,i)=>({p:p.price*f,side:i<3?'resistance':'support',name:i<3?'R'+(3-i):'S'+(i-2),strength:[2,3].includes(i)?'Strong':'Moderate',methods:[i===3?'Fib 0.500':'Swing level','Volume profile',i%2?'Pivot':'AVWAP'],tfs:i===3?['1h','4h','1d']:['4h','1d']}));return p}
const fmt=(n)=>n.toLocaleString('en-US',{minimumFractionDigits:state.symbol==='BTC/USDT'?0:2,maximumFractionDigits:state.symbol==='BTC/USDT'?0:2});const pct=(n)=>((n/profile().price-1)*100>=0?'+':'')+((n/profile().price-1)*100).toFixed(2)+'%';
function fibs(){const p=profile(),lo=state.anchorA??p.low,hi=state.anchorB??p.high;return [0,.236,.382,.5,.618,.786,1].map(r=>({r,p:hi-(hi-lo)*r}))}
function bars(){const p=profile(),range=p.high-p.low,n=72,arr=[];let prev=p.low+range*.2;for(let i=0;i<n;i++){const trend=i<19?.2+i*.018:i<30?.53-(i-19)*.021:i<52?.3+(i-30)*.031:.982-(i-52)*.02;const noise=(Math.sin(i*1.9)+Math.cos(i*.7))*.024;const c=i===71?p.price:p.low+range*(trend+noise);let o=prev+(Math.sin(i*2.6))*.012*range;let h=Math.max(o,c)+range*(.012+.008*(1+Math.sin(i)));let l=Math.min(o,c)-range*(.015+.008*(1+Math.cos(i)));arr.push({o,h,l,c,v:30+Math.abs(c-o)/range*900,date:i});prev=c}return arr.slice(-state.zoom)}
function td(){return {'1h':{setup:9,count:13,phase:'Buy countdown complete',tone:'cyan',note:'Short-term downside exhaustion. A completion is a condition to inspect, not a reversal guarantee.'},'4h':{setup:9,count:11,phase:'Sell countdown developing',tone:'amber',note:'Upside exhaustion is developing. Countdown has not completed; higher-timeframe structure is still constructive.'},'1d':{setup:9,count:7,phase:'Sell countdown developing',tone:'violet',note:'The daily advance remains established. No completed daily exhaustion in this fictional snapshot.'}}[state.timeframe]}
const labelNames={td9:'TD Sequential',levels:'Key levels',fib:'Fibonacci'};
function chart(mode=state.tab,mini=false){const p=profile(),data=bars(),W=mini?600:1000,H=mini?310:470,left=14,right=mini?82:100,top=27,bottom=56,plotW=W-left-right,plotH=H-top-bottom;let min=p.low-(p.high-p.low)*.08,max=p.high+(p.high-p.low)*.12;if(state.anchorA!==null){min=Math.min(min,state.anchorA*.99);max=Math.max(max,state.anchorB*1.01)}const y=v=>top+(max-v)/(max-min)*plotH;const x=i=>left+(i+.5)*plotW/data.length;const bw=plotW/data.length*.58;const overlays=mode==='levels'?p.levels:mode==='fib'?fibs().map(f=>({...f,name:f.r.toFixed(3),side:'fib'})):[{p:p.high*1.008,name:'Risk level',side:'risk'},{p:p.low+(p.high-p.low)*.26,name:'TDST',side:'support'}];return `<svg class="candles ${mini?'mini':''}" viewBox="0 0 ${W} ${H}" data-chart="${mode}" data-min="${min}" data-max="${max}" data-top="${top}" data-ph="${plotH}" role="img" aria-label="Fictional ${state.symbol} ${state.timeframe} candlestick chart with ${labelNames[mode]} overlays. Rising candles are hollow; falling candles filled."><defs><linearGradient id="zone-${mode}-${mini}" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ac98ff" stop-opacity=".10"/><stop offset="1" stop-color="#ac98ff" stop-opacity=".02"/></linearGradient></defs>${[0,1,2,3,4].map(i=>{const v=min+(max-min)*i/4;return `<line class="gridline" x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}"/><text x="${W-right+10}" y="${y(v)+4}">${fmt(v)}</text>`}).join('')}${[0,1,2,3,4,5].map(i=>`<line class="gridline" x1="${left+i*plotW/5}" x2="${left+i*plotW/5}" y1="${top}" y2="${H-bottom}"/>`).join('')}${mode==='fib'?`<rect x="${left}" y="${y(fibs()[3].p)}" width="${plotW}" height="${y(fibs()[4].p)-y(fibs()[3].p)}" fill="url(#zone-${mode}-${mini})"/>`:''}${data.map((b,i)=>`<rect x="${x(i)-bw/2}" y="${H-bottom+28-b.v*.12}" width="${bw}" height="${b.v*.12}" fill="${b.c>=b.o?'#5df8d5':'#ff849d'}" opacity=".15"/><line x1="${x(i)}" x2="${x(i)}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${b.c>=b.o?'#5df8d5':'#ff849d'}" stroke-width="1"/><rect x="${x(i)-bw/2}" y="${y(Math.max(b.o,b.c))}" width="${bw}" height="${Math.max(1.6,Math.abs(y(b.o)-y(b.c)))}" fill="${b.c>=b.o?'#0e1925':'#ff849d'}" stroke="${b.c>=b.o?'#5df8d5':'#ff849d'}" stroke-width="1"/>${mode==='td9'&&i>data.length-17&&i<data.length-7?`<text class="td-number" x="${x(i)-3}" y="${y(b.h)-8}" fill="${i===data.length-8?'#f1c578':'#9ab4c9'}">${i-data.length+17}</text>`:''}`).join('')}${overlays.map((l,i)=>{let color=l.side==='support'?'#5df8d5':l.side==='resistance'?'#ff849d':'#ac98ff';const active=state.selectedLevel===l.p;return `<g opacity="${state.selectedLevel!==null&&!active&&mode==='levels'?.32:1}"><line x1="${left}" x2="${W-right}" y1="${y(l.p)}" y2="${y(l.p)}" stroke="${color}" stroke-width="${active?2:1}" stroke-dasharray="${mode==='fib'?'2 4':'6 5'}" opacity=".7"/><rect x="${left+8}" y="${y(l.p)-16}" width="${mini?108:135}" height="15" fill="#0b1320" opacity=".9"/><text x="${left+12}" y="${y(l.p)-5}" style="fill:${color};font-size:${mini?9:10}px">${l.name} / ${fmt(l.p)}</text></g>`}).join('')}<line x1="${left}" x2="${W-right}" y1="${y(p.price)}" y2="${y(p.price)}" stroke="#e4edf9" stroke-dasharray="2 3" opacity=".6"/><rect x="${W-right+3}" y="${y(p.price)-10}" width="${right-7}" height="21" rx="2" fill="#d7e7f5"/><text x="${W-right+9}" y="${y(p.price)+4}" style="fill:#101824;font-weight:600">${fmt(p.price)}</text>${[0,1,2,3].map(i=>`<text x="${left+i*plotW/3}" y="${H-7}" text-anchor="${i===3?'end':'start'}">${state.timeframe==='1d'?['JUL 16','AUG 09','SEP 02','SEP 26'][i]:state.timeframe==='1h'?['SEP 23','SEP 24','SEP 25','SEP 26'][i]:['SEP 14','SEP 18','SEP 22','SEP 26'][i]}</text>`).join('')}</svg>`}
function meter(n,total,tone='cyan'){return `<div class="meter ${tone}">${Array.from({length:total},(_,i)=>`<i class="${i<n?'lit':''}"></i>`).join('')}</div>`}
function tdmatrix(){return `<div class="tf-matrix">${['1h','4h','1d'].map(tf=>{let count={'1h':13,'4h':11,'1d':7}[tf];return `<button class="tf-row ${state.timeframe===tf?'selected':''}" data-tf="${tf}"><span>${tf.toUpperCase()}</span><span>${tf==='1h'?'Buy exhaustion':'Sell countdown'}${meter(count,13,tf==='1h'?'cyan':'violet')}</span><strong>${count}<small>/13</small></strong></button>`}).join('')}</div>`}
function tdPanel(){const t=td();if(state.tdView==='indicators')return `<div class="panel-head"><span class="eyebrow">MOMENTUM SNAPSHOT</span><span class="chip amber">MIXED</span></div><h2>Trend leads. Momentum pauses.</h2><p class="muted small">Static indicator fixtures for interface review.</p>${[['RSI (14)','54.2','Neutral'],['MACD histogram','−128.4','Cooling'],['ADX (14)','24.6','Developing trend'],['Price vs. EMA 50','+1.8%','Above average']].map(r=>`<div class="data-row"><span>${r[0]}</span><strong>${r[1]}</strong><small>${r[2]}</small></div>`).join('')}<p class="footnote">Reference link text says “indicators”, while its destination is TD9. Both views are available here.</p>`;return `<div class="panel-head"><span class="eyebrow">01 / TIMING</span><span class="chip ${t.tone}">${state.timeframe.toUpperCase()}</span></div><h2>${t.phase}</h2><p class="small muted">${t.note}</p><div class="countdown"><span class="big-num">${t.count}<small>/13</small></span><span class="muted small">${state.timeframe==='1h'?'BUY':'SELL'} COUNTDOWN<br>Demo state · closed-bar basis</span></div>${meter(t.count,13,t.tone)}<div class="data-row"><span>Setup</span><strong>9 / 9</strong><span class="chip">COMPLETE</span></div><div class="data-row"><span>Risk level</span><strong>${fmt(profile().high*1.008)}</strong><small>Demo threshold</small></div><div class="mini-title">MULTI-TIMEFRAME ALIGNMENT</div>${tdmatrix()}<div class="callout amber"><strong>Timing is mixed.</strong><p>1h buy exhaustion sits inside a developing 4h sell countdown. Keep both visible.</p></div>`}
function levelPanel(compact=false){return `<div class="panel-head"><span class="eyebrow">02 / STRUCTURE</span><span class="chip">CLUSTERED</span></div><h2>Where price could react.</h2><p class="small muted">Confluence across methods and timeframes. Select a level to isolate it on the chart.</p><div class="level-list">${profile().levels.map(l=>`<button class="level-row ${l.side} ${state.selectedLevel===l.p?'selected':''}" data-level="${l.p}"><span class="level-id">${l.name}</span><span><strong>${fmt(l.p)}</strong><small>${l.methods.slice(0,2).join(' · ')}</small></span><span class="level-dist">${pct(l.p)}<small>${l.strength}</small></span></button>`).join('')}</div>${state.selectedLevel!==null?`<button class="text-button" data-clear-level>Show all levels ↗</button>`:''}${compact?'':`<div class="callout"><strong>S1 / Cross-method agreement</strong><p>${profile().levels[3].tfs.join(' + ')} · ${profile().levels[3].methods.join(' + ')}. A cluster is evidence, not a probability.</p></div>`}`}
function fibPanel(){const p=profile();return `<div class="panel-head"><span class="eyebrow">03 / LOCATION</span><span class="chip violet">RETRACEMENT</span></div><h2>Anchor the pullback.</h2><p class="small muted">An upward swing from A to B. Ratios measure the retracement down from B.</p><form id="anchor-form"><div class="anchor-fields"><label>A / Swing low<input aria-label="Swing low" id="anchor-low" type="number" step="any" value="${state.anchorA??p.low}" required></label><label>B / Swing high<input aria-label="Swing high" id="anchor-high" type="number" step="any" value="${state.anchorB??p.high}" required></label></div><div class="row"><button class="button" type="submit">Apply anchors</button><button class="button subtle" type="button" data-pick>${state.anchorMode?'Picking '+state.anchorMode:'Pick on chart'}</button></div><p class="error" role="alert">${state.formError}</p></form><div class="fib-rows">${fibs().map(f=>`<div class="fib-row ${[.5,.618].includes(f.r)?'focus':''}"><span>${f.r.toFixed(3)}</span><strong>${fmt(f.p)}</strong><span>${pct(f.p)}</span></div>`).join('')}</div><div class="callout violet"><strong>0.500–0.618 / Watch the zone</strong><p>Compare this band with S/R clusters. Anchor choice changes every level; ratios do not predict a reaction.</p></div>`}
function inspector(mode=state.tab){return mode==='td9'?tdPanel():mode==='levels'?levelPanel():fibPanel()}
function header(){let p=profile();return `<main><div class="heading"><div><div class="eyebrow">MARKET INTELLIGENCE / RESEARCH DESK</div><h1>Read the <span>confluence.</span></h1><p>Timing, structure and location. Three lenses. One market.</p></div><button class="button" data-help>Reference & methodology ↗</button></div><section class="toolbar"><div class="asset-select"><label for="symbol">MARKET / SYMBOL</label><select id="symbol">${Object.entries(profiles).map(([s,v])=>`<option value="${s}" ${s===state.symbol?'selected':''}>${v.market} / ${s}</option>`).join('')}</select></div><div class="quote"><strong>${fmt(p.price)}</strong><span class="chip">SAMPLE SNAPSHOT</span><small>${p.name} · ${state.symbol==='BTC/USDT'?'USDT':'USD'}</small></div><div class="toolbar-right"><div class="seg" aria-label="Chart timeframe">${['1h','4h','1d'].map(tf=>`<button data-tf="${tf}" aria-pressed="${state.timeframe===tf}" class="${state.timeframe===tf?'active':''}">${tf.toUpperCase()}</button>`).join('')}</div><span class="timestamp">26 SEP 2026 / 04:00 SGT<br>Offline · no market feed connected</span></div></section>`}
function methodTabs(){return `<div class="method-tabs">${Object.entries(labelNames).map(([k,n],i)=>`<button data-tab="${k}" class="${state.tab===k?'active':''}" aria-pressed="${state.tab===k}"><span>0${i+1}</span>${n}</button>`).join('')}</div>`}
function chartCard(mode=state.tab,mini=false){const b=bars().at(-1);return `<section class="chart-panel panel"><div class="panel-head"><div><span class="eyebrow">${state.symbol} / ${state.timeframe.toUpperCase()}</span><h2>${labelNames[mode]}</h2></div><div class="chart-tools"><button data-zoom aria-label="Toggle chart zoom">${state.zoom===72?'Zoom in +':'Reset zoom'}</button><span class="chip ${mode==='fib'?'violet':''}">${mode==='td9'?'SETUP + COUNTDOWN':mode==='levels'?'6 LEVELS':'A → B'}</span></div></div><div class="ohlc" aria-live="polite">O <span>${fmt(b.o)}</span> H <span>${fmt(b.h)}</span> L <span>${fmt(b.l)}</span> C <span>${fmt(b.c)}</span></div><div class="chart-wrap ${state.anchorMode&&mode==='fib'?'picking':''}">${chart(mode,mini)}</div><div class="chart-caption"><span>□ Rising &nbsp; ■ Falling &nbsp; / &nbsp; Volume below</span><span>${state.anchorMode?'CLICK TO SET ANCHOR '+state.anchorMode:'SYNTHETIC OHLC / '+state.zoom+' BARS'}</span></div><details class="ohlc-table"><summary>Inspect last 5 OHLC bars</summary><table><thead><tr><th>Bar</th><th>Open</th><th>High</th><th>Low</th><th>Close</th></tr></thead><tbody>${bars().slice(-5).map((b,i)=>`<tr><td>−${4-i}</td><td>${fmt(b.o)}</td><td>${fmt(b.h)}</td><td>${fmt(b.l)}</td><td>${fmt(b.c)}</td></tr>`).join('')}</tbody></table></details></section>`}
function evidenceStrip(){return `<section class="evidence-strip"><button data-tab="td9"><span class="eyebrow">01 / TIMING</span><strong>${td().count}/13 ${state.timeframe==='1h'?'buy':'sell'} countdown</strong><small>${state.timeframe.toUpperCase()} · model state is illustrative</small></button><button data-tab="levels"><span class="eyebrow">02 / STRUCTURE</span><strong>S1 ${fmt(profile().levels[3].p)} <span class="muted">/</span> R1 ${fmt(profile().levels[2].p)}</strong><small>Support ${pct(profile().levels[3].p)} · resistance ${pct(profile().levels[2].p)}</small></button><button data-tab="fib"><span class="eyebrow">03 / LOCATION</span><strong>0.500 retracement / ${fmt(fibs()[3].p)}</strong><small>Compare with the nearest support cluster</small></button></section>`}
function VariantA(){return `${methodTabs()}<div class="analysis-grid">${chartCard()}<aside class="panel inspector">${state.tab==='td9'?`<div class="seg sub-tabs"><button data-td-view="sequential" class="${state.tdView==='sequential'?'active':''}">Sequential</button><button data-td-view="indicators" class="${state.tdView==='indicators'?'active':''}">Indicators</button></div>`:''}${inspector()}</aside></div>${evidenceStrip()}`}
function VariantB(){return `<div class="section-heading"><div><div class="eyebrow">PARALLEL EVIDENCE / SAME SYMBOL, SAME TIMEFRAME</div><h2>See the agreement. Spot the conflict.</h2></div><span class="chip amber">NO COMPOSITE BUY / SELL SCORE</span></div><div class="compare-grid">${['td9','levels','fib'].map(mode=>`<div class="compare-column">${chartCard(mode,true)}<section class="panel inspector">${inspector(mode)}</section></div>`).join('')}</div>`}
function VariantC(){const p=profile();return `<div class="briefing-grid"><section class="briefing panel"><div class="panel-head"><span class="eyebrow">MARKET BRIEF / YOUR DAILY READ</span><span class="chip amber">MIXED EVIDENCE</span></div><h2 class="brief-title">Trend intact.<br><span>Timing unresolved.</span></h2><p class="brief-copy">The sample market is between a support cluster and nearby resistance. TD timing differs by timeframe; Fibonacci adds a price map, not a directional vote.</p><div class="evidence-notes"><button data-evidence="td9"><span class="step">01</span><div><h3>Timing needs context.</h3><p>${state.timeframe.toUpperCase()} shows ${td().count}/13. Compare the completed 1h buy countdown with the developing daily structure.</p></div><span>↗</span></button><button data-evidence="levels"><span class="step">02</span><div><h3>Let structure define the boundaries.</h3><p>Nearest support ${fmt(p.levels[3].p)}. Nearest resistance ${fmt(p.levels[2].p)}. Inspect the methods behind each cluster.</p></div><span>↗</span></button><button data-evidence="fib"><span class="step">03</span><div><h3>Know where you are in the swing.</h3><p>0.500 retracement at ${fmt(fibs()[3].p)}. Check how this compares with support before interpreting confluence.</p></div><span>↗</span></button></div><div class="brief-note">DEMO BRIEF / Hand-authored from fictional data. Not generated by AI or a validated signal engine.</div></section><aside class="panel ladder-panel"><div class="panel-head"><span class="eyebrow">PRICE LANDSCAPE</span><span class="chip">${state.symbol}</span></div><h2>Levels around the market.</h2><div class="price-ladder">${p.levels.map((l,i)=>`${i===3?`<div class="ladder-spot"><span>SPOT</span><strong>${fmt(p.price)}</strong><span>◀</span></div>`:''}<button class="ladder-level ${l.side}" data-evidence="levels"><span>${l.name}</span><div><strong>${fmt(l.p)}</strong><small>${l.methods[0]}</small></div><span>${pct(l.p)}</span></button>`).join('')}</div><div class="callout violet"><strong>Fib 0.500 / ${fmt(fibs()[3].p)}</strong><p>Distance from S1: ${fmt(Math.abs(fibs()[3].p-p.levels[3].p))}. Nearness alone is not confirmation.</p></div></aside></div><section class="scenario-grid"><article class="panel"><span class="eyebrow">IF / ABOVE RESISTANCE</span><h3>A close above ${fmt(p.levels[2].p)}</h3><p>Reassess the next resistance cluster and whether the TD context has changed.</p></article><article class="panel"><span class="eyebrow">IF / AT SUPPORT</span><h3>A test of ${fmt(p.levels[3].p)}</h3><p>Inspect price response near support and the retracement band; do not infer a bounce.</p></article><article class="panel"><span class="eyebrow">IF / BELOW SUPPORT</span><h3>A close below ${fmt(p.levels[3].p)}</h3><p>Reassess structure toward ${fmt(p.levels[4].p)}. Prior support may no longer hold.</p></article></section>`}
function stateFooter(){return `<footer><span>PROTOTYPE / SIMULATED OHLC + TD STATES + LEVELS / READ-ONLY</span><details><summary>Inspect state</summary><pre>${JSON.stringify({...state,market:profile().market,quote:profile().price,td:td(),fibs:fibs(),levels:profile().levels,dataSource:'fictional'},null,2)}</pre></details></footer>`}
function sync(){const u=new URL(location.href);for(const k of ['variant','symbol','timeframe','tab'])u.searchParams.set(k,state[k]);u.searchParams.set('market',profile().market==='Crypto'?'crypto':'stocks');history.replaceState({},'',u)}
function render(){sync();document.getElementById('app').innerHTML=appShell(header()+({A:VariantA,B:VariantB,C:VariantC})[state.variant]()+stateFooter()+'</main>','market');document.getElementById('switcher').innerHTML=`<div class="switcher"><span>MARKET PROTOTYPE<br><small>← → SWITCH LAYOUT</small></span><button data-step="-1" aria-label="Previous layout">←</button>${[['A','Chart desk'],['B','Compare'],['C','Market brief']].map(([k,n])=>`<button data-variant="${k}" class="${state.variant===k?'active':''}" aria-pressed="${state.variant===k}">${k} / ${n}</button>`).join('')}<button data-step="1" aria-label="Next layout">→</button></div>`;console.info('MARKET_PROTOTYPE_STATE',JSON.stringify(state))}
function variant(k){state.variant=k;state.anchorMode=null;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.variant)variant(b.dataset.variant);else if(b.dataset.step)variant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+Number(b.dataset.step)+3)%3]);else if(b.dataset.tab){state.tab=b.dataset.tab;state.anchorMode=null;render()}else if(b.dataset.tf){state.timeframe=b.dataset.tf;render()}else if(b.dataset.level){state.selectedLevel=Number(b.dataset.level);render()}else if(b.hasAttribute('data-clear-level')){state.selectedLevel=null;render()}else if(b.dataset.tdView){state.tdView=b.dataset.tdView;render()}else if(b.hasAttribute('data-zoom')){state.zoom=state.zoom===72?36:72;render()}else if(b.hasAttribute('data-pick')){state.anchorMode=state.anchorMode?null:'A';state.formError='';render()}else if(b.dataset.evidence){state.tab=b.dataset.evidence;variant('A')}else if(b.hasAttribute('data-help')){const d=document.getElementById('help');d.innerHTML='<div class="panel-head"><h2>Reference & methodology</h2><button class="button" data-close>Close ×</button></div><p>Inspired by TradingSignal’s TD Sequential, multi-timeframe S/R clusters and manually anchored Fibonacci views. The original root URLs now show a landing page; the working views are under /app.</p><p>This prototype uses synthetic candles and pre-authored TD / S/R fixtures. Changing timeframe switches the illustrative context, not a validated indicator calculation. Fibonacci values are calculated from the selected anchors.</p><p>Reference links: <a href="https://tradingsignal.pro/app?market=crypto&symbol=BTC%2FUSDT&timeframe=4h&tab=td9" target="_blank" rel="noopener">TD Sequential ↗</a> · <a href="https://tradingsignal.pro/app?market=crypto&symbol=BTC%2FUSDT&timeframe=4h&tab=levels" target="_blank" rel="noopener">Key levels ↗</a> · <a href="https://tradingsignal.pro/app?market=crypto&symbol=BTC%2FUSDT&timeframe=4h&tab=fib&fib=retrace" target="_blank" rel="noopener">Fibonacci ↗</a></p>';d.showModal()}else if(b.hasAttribute('data-close'))document.getElementById('help').close();return}const svg=e.target.closest('svg[data-chart="fib"]');if(svg&&state.anchorMode){const box=svg.getBoundingClientRect(),vbox=svg.viewBox.baseVal;const sy=(e.clientY-box.top)/box.height*vbox.height;let value=Number(svg.dataset.max)-(sy-Number(svg.dataset.top))/Number(svg.dataset.ph)*(Number(svg.dataset.max)-Number(svg.dataset.min));value=Math.round(value*100)/100;if(state.anchorMode==='A'){state.anchorA=value;state.anchorMode='B'}else{const lo=Math.min(state.anchorA,value),hi=Math.max(state.anchorA,value);if(lo===hi){state.formError='Choose two different prices.';render();return}state.anchorA=lo;state.anchorB=hi;state.anchorMode=null}render()}});
document.addEventListener('change',e=>{if(e.target.id==='symbol'){state.symbol=e.target.value;state.anchorA=null;state.anchorB=null;state.anchorMode=null;state.selectedLevel=null;state.formError='';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='anchor-form'){e.preventDefault();const a=Number(document.getElementById('anchor-low').value),b=Number(document.getElementById('anchor-high').value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=a){state.formError='Use positive prices with swing low below swing high.'}else{state.anchorA=a;state.anchorB=b;state.formError='';state.anchorMode=null}render()}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.getElementById('help').open)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();variant(['A','B','C'][(['A','B','C'].indexOf(state.variant)+(e.key==='ArrowRight'?1:2))%3])}});render();
</script></body></html>

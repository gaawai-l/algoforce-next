name: algoforce-foundation
services:
  wealthfolio:
    network_mode: bridge
    image: wealthfolio/wealthfolio:3.8.0@sha256:3c6f117828949204029c2b4a391f039e62987b4e091139e11b04e6764b5f6866
    ports:
      - "127.0.0.1:8088:8088"
    env_file:
      - .local/wealthfolio.env
    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: /data/wealthfolio.db
      WF_AUTH_REQUIRED: "false"
      WF_MCP_ENABLED: "false"
      WF_CORS_ALLOW_ORIGINS: "http://127.0.0.1:1420"
    volumes:
      - ./.local/wealthfolio-data:/data
    restart: "no"
